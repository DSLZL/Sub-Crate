[package]
name = "sub-store-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
rquickjs = { version = "=0.14.0", features = ["futures"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util"] }
