[package]
name = "sub-store-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
aws-lc-rs = { version = "=1.18.2", default-features = false }
base64 = "=0.23.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "rustls-platform-verifier", "aws-lc-rs"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
jiff = "=0.2.38"
libc = "=0.2.190"
maxminddb = "=0.32.0"
md-5 = "=0.11.0"
percent-encoding = "=2.3.2"
rquickjs = { version = "=0.14.0", features = ["futures"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls-platform-verifier = "=0.7.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12", "aws-lc-rs"] }
tower-service = "=0.3.3"

# The interpreter must execute crypto fixtures within the same 15s host budget.
[profile.dev.package.rquickjs-sys]
opt-level = 3
