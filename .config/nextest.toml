[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"

[test-groups]
browser = { max-threads = 1 }
containers = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'test(frontend::)'
test-group = 'browser'

[[profile.ci.overrides]]
filter = 'test(docker::)'
test-group = 'containers'

[[profile.ci.overrides]]
filter = 'test(=frozen_node_unit_suite)'
threads-required = "num-test-threads"

[profile.benchmark]
inherits = "ci"
test-threads = 1

[profile.benchmark.junit]
path = "junit.xml"

[profile.acceptance]
inherits = "ci"

[profile.acceptance.junit]
path = "junit-acceptance.xml"

[profile.delivery]
inherits = "ci"

[profile.delivery.junit]
path = "junit-delivery.xml"

[profile.production]
inherits = "ci"

[profile.production.junit]
path = "junit-production.xml"

[profile.cpu-parse]
inherits = "ci"

[profile.cpu-parse.junit]
path = "junit-cpu-parse.xml"

[profile.cpu-conversion]
inherits = "ci"

[profile.cpu-conversion.junit]
path = "junit-cpu-conversion.xml"

[profile.frontend]
inherits = "ci"

[profile.frontend.junit]
path = "junit-frontend.xml"

[profile.frontend-delivery]
inherits = "ci"

[profile.frontend-delivery.junit]
path = "junit-frontend-delivery.xml"
