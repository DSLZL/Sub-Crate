[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"

[test-groups]
browser = { max-threads = 1 }
containers = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'test(frontend::)'
test-group = 'browser'

[[profile.ci.overrides]]
filter = 'test(docker::)'
test-group = 'containers'

[profile.benchmark]
inherits = "ci"
test-threads = 1

[profile.benchmark.junit]
path = "junit.xml"

[profile.acceptance]
inherits = "ci"

[profile.acceptance.junit]
path = "junit-acceptance.xml"

[profile.delivery]
inherits = "ci"

[profile.delivery.junit]
path = "junit-delivery.xml"

[profile.production]
inherits = "ci"

[profile.production.junit]
path = "junit-production.xml"
