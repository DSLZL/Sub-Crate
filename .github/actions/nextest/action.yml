name: Fixed Rust nextest tooling
description: Install the pinned test runner and keep compiler output on the Actions runner
runs:
  using: composite
  steps:
    - name: Keep harness compiler output on the runner
      shell: bash
      run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sub-store-nextest-build" >> "$GITHUB_ENV"
    - name: Install fixed Rust toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
        rustup override set 1.98.0
    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
      with:
        tool: nextest@0.9.149
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/sub-store-nextest-build
        key: nextest-performance-${{ runner.os }}-${{ runner.arch }}-1.98.0-${{ hashFiles('tests/Cargo.toml', 'tests/Cargo.lock') }}
        restore-keys: nextest-performance-${{ runner.os }}-${{ runner.arch }}-1.98.0-
