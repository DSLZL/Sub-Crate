name: Rust toolchain and build caches
description: Install the pinned toolchain and nextest, then enable the Cargo and sccache caches
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
        rustup override set 1.98.0
    - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
      with:
        tool: nextest@0.9.151
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Enable CI build settings
      shell: bash
      run: |
        {
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target"
          echo "CARGO_INCREMENTAL=0"
          # Line tables keep test backtraces useful at a fraction of full debug info.
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          echo "CARGO_NET_RETRY=10"
          echo "RUSTUP_MAX_RETRIES=10"
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
          # The cache service throttles uploads; a rejected request must only cost a local compile.
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
    # Compiled dependencies, build scripts and proc macros, which sccache cannot store.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-on-failure: true
