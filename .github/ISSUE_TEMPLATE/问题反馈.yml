name: 问题反馈
description: 先读完排查方法再反馈
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        **先读我**

        [Rust 部署与脚本兼容说明](https://github.com/DSLZL/Sub-Crate/blob/main/rust/README.md)
  - type: checkboxes
    id: read-troubleshooting
    attributes:
      label: 阅读确认
      options:
        - label: 我已阅读上方 Rust 部署与脚本兼容说明
          required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 运行环境
      description: 请选择 Rust 后端的运行平台。
      multiple: false
      options:
        - Linux x64
        - Linux arm64
        - Windows x64
        - Docker Linux x64
        - Docker Linux arm64
        - 其他
    validations:
      required: true
  - type: dropdown
    id: affected-areas
    attributes:
      label: 影响范围
      description: 可多选，请选择和问题相关的部分。
      multiple: true
      options:
        - 后端
        - 前端
        - 订阅转换
        - 节点/策略组
        - 同步/缓存
        - 配置/环境变量
        - 目标客户端配置
        - 其他
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: 系统或容器环境版本
      description: 填写系统版本；使用 Docker 时提供 Docker 版本和镜像标识。
    validations:
      required: true
  - type: input
    id: backend-version
    attributes:
      label: 后端版本
      description: 填写 Rust 发布版本或源提交 SHA。
    validations:
      required: true
  - type: input
    id: frontend-version
    attributes:
      label: 前端版本
      description: 填写当前使用的前端版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现方式
      description: 请按步骤说明如何复现。
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期望表现
      description: 描述你认为应该发生什么。
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际表现
      description: 描述实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 例如截图、日志、配置片段或相关链接。
