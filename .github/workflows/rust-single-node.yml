name: Single-node parsing comparison

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Inspect HTTP tail batches from a completed public-fixture run without rebuilding
        type: string
        default: ''
      diagnose_tail:
        description: Repeat Hy2 and SS control requests in three fresh server rounds, with separate tail profiles
        type: boolean
        default: false
  push:
    branches: [codex/rust-server-parity]
    paths: [.github/workflows/rust-single-node.yml, tests/performance/single-node.*, tests/performance/single_node.*]

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.inspect_run != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inspect existing public-fixture HTTP batches on the runner
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
        shell: bash
        run: |
          [[ "$INSPECT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "single-node-$INSPECT_RUN-1" --dir "$RUNNER_TEMP/single-node-inspect"
          python3.12 -m venv "$RUNNER_TEMP/single-node-venv"
          "$RUNNER_TEMP/single-node-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
          "$RUNNER_TEMP/single-node-venv/bin/python" -m unittest discover -s tests/performance -p 'test_*.py'
          "$RUNNER_TEMP/single-node-venv/bin/python" tests/performance/single_node.py \
            --inspect "$RUNNER_TEMP/single-node-inspect"
  compare:
    if: inputs.inspect_run == '' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9c19111bae2af2654caa339151e4eabd12b586bb
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install locked tooling on runner
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir .performance/original/backend install --frozen-lockfile
          python3.12 -m venv "$RUNNER_TEMP/single-node-venv"
          "$RUNNER_TEMP/single-node-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .performance/rust/rust/target
          key: single-node-linux-x64-rust-1.98.0-${{ github.sha }}
          restore-keys: subscription-performance-linux-x64-rust-1.98.0-
      - name: Build and check exact source
        run: |
          cargo +1.98.0 fmt --manifest-path .performance/rust/rust/Cargo.toml --all -- --check
          "$RUNNER_TEMP/single-node-venv/bin/python" -m unittest discover -s tests/performance -p 'test_*.py'
          (cd .performance/original/backend && node bundle-esbuild.js)
          cargo +1.98.0 build --manifest-path .performance/rust-baseline/rust/Cargo.toml --locked --release --bin sub-store-rust
          cargo +1.98.0 test --manifest-path .performance/rust-baseline/rust/Cargo.toml --locked --release --bin sub-store-rust --no-run --message-format=json > "$RUNNER_TEMP/single-node-baseline-build.jsonl"
          cargo +1.98.0 clippy --manifest-path .performance/rust/rust/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust --no-run --message-format=json > "$RUNNER_TEMP/single-node-build.jsonl"
          cargo +1.98.0 build --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust
          git -C .performance/original diff --exit-code
          git -C .performance/rust diff --exit-code
          git -C .performance/rust-baseline diff --exit-code
      - name: Compare pure parsing, parser setup and actual HTTP requests
        run: |
          test_binary=$("$RUNNER_TEMP/single-node-venv/bin/python" -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; matches=[row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("profile",{}).get("test") and row.get("executable")]; assert len(matches)==1; print(matches[0])' "$RUNNER_TEMP/single-node-build.jsonl")
          baseline_test_binary=$("$RUNNER_TEMP/single-node-venv/bin/python" -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; matches=[row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("profile",{}).get("test") and row.get("executable")]; assert len(matches)==1; print(matches[0])' "$RUNNER_TEMP/single-node-baseline-build.jsonl")
          tail_args=()
          if [[ '${{ inputs.diagnose_tail }}' == 'true' ]]; then tail_args=(--diagnose-tail); fi
          "$RUNNER_TEMP/single-node-venv/bin/python" tests/performance/single_node.py \
            --original "$GITHUB_WORKSPACE/.performance/original" \
            --rust "$GITHUB_WORKSPACE/.performance/rust" --rust-test "$test_binary" \
            --rust-baseline "$GITHUB_WORKSPACE/.performance/rust-baseline" --rust-baseline-test "$baseline_test_binary" \
            --scratch "$RUNNER_TEMP/single-node-scratch" --output "$RUNNER_TEMP/single-node-results" "${tail_args[@]}"
          cat "$RUNNER_TEMP/single-node-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements and public-fixture failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: single-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/single-node-results/
            ${{ runner.temp }}/single-node-scratch/*.log
            ${{ runner.temp }}/single-node-scratch/*/server.log
          if-no-files-found: warn
          retention-days: 30
