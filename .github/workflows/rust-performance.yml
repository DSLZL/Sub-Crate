name: Supplied subscription performance

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Inspect sanitized diagnostics from a completed run
        type: string
        default: ''
      inspect_attempt:
        description: Immutable attempt to inspect without repeating preparation
        type: string
        default: '1'
      diagnose_parse:
        description: Diagnose all individual sources and three parse/pre-health requests
        type: boolean
        default: false
      diagnose_health:
        description: Compare the full-input health script with the frozen Rust baseline
        type: boolean
        default: false
      profile_pipeline:
        description: With diagnose_health, profile stages in the repeated candidate with the same binary
        type: boolean
        default: false

permissions:
  contents: read

env:
  PERF_RUST_REVISION: af08b0649c4d2f2814fe38ce6943b1397f5e1c14
  PERF_BASELINE_REVISION: ee64ab9f7376a68c126950caee256bf3fb9c2b12
  PERF_DIAGNOSTIC: ${{ inputs.diagnose_health && 'health' || inputs.diagnose_parse && 'parse' || '' }}
  PERF_PROFILE_PIPELINE: ${{ inputs.profile_pipeline && '1' || '0' }}

concurrency:
  group: ${{ inputs.inspect_run && 'subscription-report-inspection' || inputs.diagnose_health && 'subscription-health-diagnostic' || inputs.diagnose_parse && 'subscription-parse-diagnostic' || 'supplied-subscription-performance' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Check benchmark invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: ./.github/actions/nextest
      - name: Validate mode, source and benchmark invariants
        shell: bash
        run: |
          [[ '${{ inputs.diagnose_health }}' != 'true' || '${{ inputs.diagnose_parse }}' != 'true' ]]
          [[ "$PERF_PROFILE_PIPELINE" != 1 || "$PERF_DIAGNOSTIC" == health ]]
          cargo +1.98.0 fmt --manifest-path tests/Cargo.toml --all -- --check
          cargo +1.98.0 fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo +1.98.0 clippy --manifest-path tests/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.98.0 nextest list --manifest-path tests/Cargo.toml --locked --release --lib --config-file .config/nextest.toml
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --lib --config-file .config/nextest.toml --profile ci
      - name: Preserve self-check JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sub-store-nextest-build/nextest/
          if-no-files-found: warn

  inspect:
    needs: checks
    if: inputs.inspect_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nextest
      - name: Read existing sanitized diagnostics on runner
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
          INSPECT_ATTEMPT: ${{ inputs.inspect_attempt }}
          PERF_INSPECT: ${{ runner.temp }}/performance-inspect
        shell: bash
        run: |
          [[ "$INSPECT_RUN" =~ ^[0-9]+$ && "$INSPECT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh run download "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" --name "subscription-performance-$INSPECT_RUN-$INSPECT_ATTEMPT" --dir "$PERF_INSPECT" ||
          gh run download "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" --name "subscription-performance-prepare-$INSPECT_RUN-$INSPECT_ATTEMPT" --dir "$PERF_INSPECT"
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --test performance --config-file .config/nextest.toml --profile perf-inspect -E 'test(=subscription_inspect)' --success-output immediate
      - name: Preserve inspection JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sub-store-nextest-build/nextest/
          if-no-files-found: warn

  prepare:
    name: Build, import and freeze inputs once
    needs: checks
    if: inputs.inspect_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      attempt: ${{ steps.matrix.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PERF_RUST_REVISION }}
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.diagnose_health
        with:
          ref: ${{ env.PERF_BASELINE_REVISION }}
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .performance/frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: ./.github/actions/nextest
      - name: Install fixed tooling and locked application dependencies
        run: |
          npm install --global pnpm@11.0.9 agent-browser@0.27.3
          pnpm --dir .performance/original/backend install --frozen-lockfile
          pnpm --dir .performance/frontend install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .performance/rust/rust/target
            .performance/rust-baseline/rust/target
          key: subscription-nextest-apps-1.98.0-${{ env.PERF_RUST_REVISION }}-${{ env.PERF_BASELINE_REVISION }}
      - name: Build exact original, Rust and unchanged frontend
        run: |
          (cd .performance/original/backend && node bundle-esbuild.js)
          pnpm --dir .performance/frontend build
          cargo +1.98.0 build --manifest-path .performance/rust/rust/Cargo.toml --target-dir "$GITHUB_WORKSPACE/.performance/rust/rust/target" --locked --release --bin sub-store-rust
          git -C .performance/original diff --exit-code
          git -C .performance/rust diff --exit-code
          git -C .performance/frontend diff --exit-code
      - name: Execute candidate regressions before whole-request comparison
        if: inputs.diagnose_health
        run: |
          cargo +1.98.0 nextest list --manifest-path .performance/rust/rust/Cargo.toml --target-dir "$GITHUB_WORKSPACE/.performance/rust/rust/target" --locked --release --bin sub-store-rust --config-file .config/nextest.toml
          cargo +1.98.0 nextest run --manifest-path .performance/rust/rust/Cargo.toml --target-dir "$GITHUB_WORKSPACE/.performance/rust/rust/target" --locked --release --bin sub-store-rust --config-file .config/nextest.toml --profile production
          cargo +1.98.0 build --manifest-path .performance/rust-baseline/rust/Cargo.toml --target-dir "$GITHUB_WORKSPACE/.performance/rust-baseline/rust/target" --locked --release --bin sub-store-rust
          git -C .performance/rust-baseline diff --exit-code
      - name: Compare per-node components on the same runner
        if: inputs.diagnose_health
        run: |
          for variant in candidate baseline candidate_repeat; do
            checkout=rust; profile=cpu-conversion
            if [[ "$variant" == baseline ]]; then checkout=rust-baseline; fi
            if [[ "$variant" == candidate_repeat ]]; then profile=cpu-conversion-repeat; fi
            echo "Per-node profile: variant=$variant source=$(git -C ".performance/$checkout" rev-parse HEAD)"
            cargo +1.98.0 nextest run --manifest-path ".performance/$checkout/rust/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.performance/$checkout/rust/target" --locked --release --bin sub-store-rust --config-file .config/nextest.toml --profile "$profile" --run-ignored only -E 'test(=script_conversion::tests::profile_node_production)' --success-output immediate
          done
      - name: Install headless Chromium
        run: agent-browser install --with-deps
      - name: Import unchanged file, capture source text and seal private inputs
        env:
          BENCHMARK_SUBSCRIPTION_B64: ${{ secrets.BENCHMARK_SUBSCRIPTION_B64 }}
          BENCHMARK_ASSET_TOKEN: ${{ github.token }}
          PERF_ORIGINAL: ${{ github.workspace }}/.performance/original
          PERF_RUST: ${{ github.workspace }}/.performance/rust
          PERF_FRONTEND: ${{ github.workspace }}/.performance/frontend
          PERF_PUBLIC: ${{ runner.temp }}/subscription-performance-public
          PERF_FROZEN: ${{ runner.temp }}/subscription-performance-inputs.bin
        run: |
          umask 077
          if [[ "$PERF_DIAGNOSTIC" == health ]]; then export PERF_BASELINE="$GITHUB_WORKSPACE/.performance/rust-baseline"; fi
          export TEST_NODE="$(node -p 'process.execPath')"
          export TEST_BROWSER="$(npm root --global)/agent-browser/bin/agent-browser-linux-x64"
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --test performance --config-file .config/nextest.toml --profile perf-prepare -E 'test(=subscription_prepare)' --success-output immediate
      - name: Select independent same-runner pairs
        id: matrix
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --test performance --config-file .config/nextest.toml --profile perf-matrix -E 'test(=subscription_matrix)'
      - name: Archive the public builds once
        run: |
          payloads=(.performance/original/backend/dist .performance/frontend/dist .performance/rust/rust/target/release/sub-store-rust)
          if [[ "$PERF_DIAGNOSTIC" == health ]]; then payloads+=(.performance/rust-baseline/rust/target/release/sub-store-rust); fi
          tar -czf "$RUNNER_TEMP/subscription-performance-build.tar.gz" "${payloads[@]}"
      - name: Share public application builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-build.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Share authenticated encrypted source text and UI-created seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-inputs.bin
          compression-level: 0
          retention-days: 1
      - name: Show sanitized report
        if: always()
        run: if test -f "$RUNNER_TEMP/subscription-performance-public/summary.md"; then cat "$RUNNER_TEMP/subscription-performance-public/summary.md"; fi
      - name: Preserve sanitized preparation and JUnit, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/subscription-performance-public/
            ${{ runner.temp }}/sub-store-nextest-build/nextest/
            .performance/rust/rust/target/nextest/
            .performance/rust-baseline/rust/target/nextest/
          if-no-files-found: warn
          retention-days: 30

  compare:
    name: Pair ${{ matrix.shard }}
    needs: prepare
    if: inputs.inspect_run == '' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PERF_RUST_REVISION }}
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.diagnose_health
        with:
          ref: ${{ env.PERF_BASELINE_REVISION }}
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .performance/frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: ./.github/actions/nextest
      - name: Install fixed Node reference dependencies
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir .performance/original/backend install --frozen-lockfile --prod
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-build-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-build
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-inputs-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - name: Extract exact public builds
        run: tar -xzf "$RUNNER_TEMP/performance-build/subscription-performance-build.tar.gz"
      - name: Validate frozen inputs and measure this pair
        env:
          BENCHMARK_SUBSCRIPTION_B64: ${{ secrets.BENCHMARK_SUBSCRIPTION_B64 }}
          PERF_ORIGINAL: ${{ github.workspace }}/.performance/original
          PERF_RUST: ${{ github.workspace }}/.performance/rust
          PERF_FRONTEND: ${{ github.workspace }}/.performance/frontend
          PERF_PUBLIC: ${{ runner.temp }}/subscription-performance-public
          PERF_FROZEN: ${{ runner.temp }}/performance-inputs/subscription-performance-inputs.bin
          PERF_SHARD: ${{ matrix.shard }}
        run: |
          umask 077
          if [[ "$PERF_DIAGNOSTIC" == health ]]; then export PERF_BASELINE="$GITHUB_WORKSPACE/.performance/rust-baseline"; fi
          export TEST_NODE="$(node -p 'process.execPath')"
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --test performance --config-file .config/nextest.toml --profile perf-pair -E 'test(=subscription_pair)' --success-output immediate
      - name: Preserve sanitized pair and JUnit, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/subscription-performance-public/
            ${{ runner.temp }}/sub-store-nextest-build/nextest/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Verify and combine all pairs
    needs: [prepare, compare]
    if: always() && inputs.inspect_run == '' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-prepare-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-prepared
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: subscription-performance-shard-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/performance-workers
      - name: Reject incomplete, duplicate or unequal work
        env:
          PERF_PREPARED: ${{ runner.temp }}/performance-prepared
          PERF_WORKERS: ${{ runner.temp }}/performance-workers
          PERF_PUBLIC: ${{ runner.temp }}/subscription-performance-public
        shell: bash
        run: |
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --release --test performance --config-file .config/nextest.toml --profile perf-aggregate -E 'test(=subscription_aggregate)' --success-output immediate
          cat "$PERF_PUBLIC/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve sanitized aggregate and JUnit, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/subscription-performance-public/
            ${{ runner.temp }}/sub-store-nextest-build/nextest/
          if-no-files-found: warn
          retention-days: 30
