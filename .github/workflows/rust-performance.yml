name: Supplied subscription performance

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Inspect bounded sanitized diagnostics from an existing run without rebuilding
        type: string
        default: ''
      diagnose_parse:
        description: Only diagnose individual sources and three parse/pre-health requests
        type: boolean
        default: false
      diagnose_health:
        description: Profile the full-input health script and three warm requests without the long matrix
        type: boolean
        default: false
      profile_pipeline:
        description: With diagnose_health, profile every Rust processor/stage in the repeated candidate (same binary on/off)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PERF_RUST_REVISION: 71f3562632d11a2174db3784bf4448ad5aa5c9f9
  PERF_BASELINE_REVISION: 887ddccb36f7724a831a89b4aad416e9c97c7c51

concurrency:
  group: ${{ inputs.inspect_run && 'subscription-report-inspection' || inputs.diagnose_health && 'subscription-health-diagnostic' || inputs.diagnose_parse && 'subscription-parse-diagnostic' || 'supplied-subscription-performance' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Check benchmark invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Check benchmark invariants and source
        run: |
          if [[ '${{ inputs.profile_pipeline }}' == 'true' ]]; then
            [[ '${{ inputs.diagnose_health }}' == 'true' && '${{ inputs.diagnose_parse }}' != 'true' ]]
          fi
          python3.12 -m venv "$RUNNER_TEMP/performance-venv"
          "$RUNNER_TEMP/performance-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
          "$RUNNER_TEMP/performance-venv/bin/python" -m py_compile tests/performance/benchmark.py tests/performance/parallel.py tests/performance/test_benchmark.py
          "$RUNNER_TEMP/performance-venv/bin/python" -m unittest discover -s tests/performance -p 'test_*.py'
      - name: Check profiler source formatting on the runner
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --manifest-path rust/Cargo.toml --all
          git diff --exit-code -- rust
  inspect:
    needs: checks
    if: inputs.inspect_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Read existing sanitized field and work diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
        shell: bash
        run: |
          [[ "$INSPECT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "subscription-performance-$INSPECT_RUN-1" --dir "$RUNNER_TEMP/performance-inspect"
          python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'performance-inspect/metrics.json').read_bytes())
          print('Report ' + json.dumps({key: report.get(key) for key in ('status', 'provenance', 'capture', 'replay', 'estimates')}, sort_keys=True))
          measured = [r for r in report['samples'] if r.get('latencies_s') and all(key in r for key in ('elapsed_s', 'cpu_s', 'rss_peak_bytes', 'output_count'))]
          groups = sorted({(r['case'], r['kind'], r['concurrency']) for r in measured})
          for case, kind, clients in groups:
              rows = [r for r in measured if (r['case'], r['kind'], r['concurrency']) == (case, kind, clients)]
              times = sorted(v for r in rows for v in r['latencies_s'])
              print('Aggregate ' + json.dumps({'case': case, 'kind': kind, 'clients': clients,
                  'blocks': len(rows), 'passed': sum(r['status'] == 'passed' for r in rows), 'requests': len(times),
                  'median_s': statistics.median(times), 'p95_s': times[math.ceil(len(times) * .95) - 1] if len(times) >= 20 else None,
                  'rps': len(times) / sum(r['elapsed_s'] for r in rows),
                  'cpu_s_per_request': sum(r['cpu_s'] for r in rows) / len(times),
                  'rss_peak_mib': max(r['rss_peak_bytes'] for r in rows) / 2**20,
                  'output_counts': sorted({r['output_count'] for r in rows})}, sort_keys=True))
          for row in report['samples']:
              if (row['block'] != 0 or row['concurrency'] != 1) and row.get('status') != 'failed':
                  continue
              keys = ('kind', 'case', 'status', 'failure', 'failure_observations', 'counts',
                      'warmup_counts', 'output_count', 'health_records', 'health_verified', 'work', 'health_profile', 'profiler_enabled', 'pipeline_profiles')
              selected = {key: row[key] for key in keys if key in row}
              selected['health_counts'] = row.get('health_counts', [])[:2]
              print(json.dumps(selected, sort_keys=True))
          PY
  prepare:
    name: Build, import and freeze inputs once
    needs: checks
    if: inputs.inspect_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      attempt: ${{ steps.matrix.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PERF_RUST_REVISION }}
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.diagnose_health
        with:
          ref: ${{ env.PERF_BASELINE_REVISION }}
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .performance/frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed tooling and locked application dependencies
        run: |
          npm install --global pnpm@11.0.9 agent-browser@0.27.3
          pnpm --dir .performance/original/backend install --frozen-lockfile
          pnpm --dir .performance/frontend install --frozen-lockfile
          python3.12 -m venv "$RUNNER_TEMP/performance-venv"
          "$RUNNER_TEMP/performance-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
      - name: Restore fixed Rust build cache (no runtime data)
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .performance/rust/rust/target
          key: subscription-performance-linux-x64-rust-1.98.0-${{ env.PERF_RUST_REVISION }}
          restore-keys: subscription-performance-linux-x64-rust-1.98.0-
      - name: Build exact original, Rust and unchanged frontend
        run: |
          (cd .performance/original/backend && node bundle-esbuild.js)
          pnpm --dir .performance/frontend build
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust
          git -C .performance/original diff --exit-code
          git -C .performance/rust diff --exit-code
          git -C .performance/frontend diff --exit-code
      - name: Execute candidate regressions before whole-request comparison
        if: inputs.diagnose_health
        run: |
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust 2>&1 | tee "$RUNNER_TEMP/candidate-tests.log"
          grep -F 'test result: ok. 39 passed; 0 failed; 3 ignored;' "$RUNNER_TEMP/candidate-tests.log"
      - name: Build the frozen Rust baseline in its separate target for whole-request comparison
        if: inputs.diagnose_health
        run: |
          cargo +1.98.0 build --manifest-path .performance/rust-baseline/rust/Cargo.toml --target-dir "$GITHUB_WORKSPACE/.performance/rust-baseline/rust/target" --locked --release --bin sub-store-rust
          git -C .performance/rust-baseline diff --exit-code
      - name: Compare per-node components on this runner (candidate, baseline, candidate again)
        if: inputs.diagnose_health
        run: |
          for variant in candidate baseline candidate_repeat; do
            checkout=.performance/rust
            if [[ "$variant" == baseline ]]; then checkout=.performance/rust-baseline; fi
            echo "Per-node profile: variant=$variant source=$(git -C "$checkout" rev-parse HEAD)"
            cargo +1.98.0 test --manifest-path "$checkout/rust/Cargo.toml" \
              --target-dir "$GITHUB_WORKSPACE/$checkout/rust/target" --locked --release \
              --bin sub-store-rust script_conversion::tests::profile_node_production \
              -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/node-profile-$variant.log"
          done
      - name: Save public build inputs before private measurements
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .performance/rust/rust/target
          key: subscription-performance-linux-x64-rust-1.98.0-${{ env.PERF_RUST_REVISION }}
      - name: Load installed browser workflow and install headless Chromium
        run: |
          agent-browser skills get core
          agent-browser install --with-deps
      - name: Import original file, capture untouched sources and seal private inputs
        env:
          BENCHMARK_SUBSCRIPTION_B64: ${{ secrets.BENCHMARK_SUBSCRIPTION_B64 }}
        run: |
          umask 077
          diagnostic_args=()
          if [[ '${{ inputs.diagnose_parse }}' == 'true' ]]; then
            diagnostic_args=(--diagnose-parse)
          fi
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then
            diagnostic_args+=(--diagnose-health --rust-baseline "$GITHUB_WORKSPACE/.performance/rust-baseline")
          fi
          if [[ '${{ inputs.profile_pipeline }}' == 'true' ]]; then diagnostic_args+=(--profile-pipeline); fi
          "$RUNNER_TEMP/performance-venv/bin/python" tests/performance/benchmark.py \
            --original "$GITHUB_WORKSPACE/.performance/original" \
            --rust "$GITHUB_WORKSPACE/.performance/rust" \
            --frontend "$GITHUB_WORKSPACE/.performance/frontend" \
            --scratch "$RUNNER_TEMP/subscription-performance-private" \
            --publish "$RUNNER_TEMP/subscription-performance-public" \
            --prepare-only --frozen "$RUNNER_TEMP/subscription-performance-inputs.bin" "${diagnostic_args[@]}"
      - name: Select independent same-runner pairs
        id: matrix
        run: |
          mode=()
          if [[ '${{ inputs.diagnose_parse }}' == 'true' ]]; then mode=(--diagnostic parse); fi
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then mode=(--diagnostic health); fi
          value=$("$RUNNER_TEMP/performance-venv/bin/python" tests/performance/parallel.py matrix "${mode[@]}")
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Archive the public builds once
        run: |
          payloads=(.performance/original/backend/dist .performance/frontend/dist .performance/rust/rust/target/release/sub-store-rust)
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then
            payloads+=(.performance/rust-baseline/rust/target/release/sub-store-rust)
          fi
          tar -czf "$RUNNER_TEMP/subscription-performance-build.tar.gz" "${payloads[@]}"
      - name: Share public application builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-build.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Share authenticated encrypted source text and UI-created seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-inputs.bin
          compression-level: 0
          retention-days: 1
      - name: Show sanitized report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/subscription-performance-public/summary.md"; then
            cat "$RUNNER_TEMP/subscription-performance-public/summary.md"
          fi
      - name: Preserve sanitized metrics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-public/
          if-no-files-found: warn
          retention-days: 30

  compare:
    name: Pair ${{ matrix.shard }}
    needs: prepare
    if: inputs.inspect_run == '' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PERF_RUST_REVISION }}
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.diagnose_health
        with:
          ref: ${{ env.PERF_BASELINE_REVISION }}
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .performance/frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed runtime tools and sampler
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir .performance/original/backend install --frozen-lockfile --prod
          python3.12 -m venv "$RUNNER_TEMP/performance-venv"
          "$RUNNER_TEMP/performance-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-build-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-build
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-inputs-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - name: Extract the exact public builds
        run: tar -xzf "$RUNNER_TEMP/performance-build/subscription-performance-build.tar.gz"
      - name: Validate fixed inputs and measure this pair
        env:
          BENCHMARK_SUBSCRIPTION_B64: ${{ secrets.BENCHMARK_SUBSCRIPTION_B64 }}
        run: |
          umask 077
          mode=(--shard '${{ matrix.shard }}')
          if [[ '${{ inputs.diagnose_parse }}' == 'true' ]]; then mode=(--diagnose-parse); fi
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then
            mode=(--diagnose-health --rust-baseline "$GITHUB_WORKSPACE/.performance/rust-baseline")
          fi
          if [[ '${{ inputs.profile_pipeline }}' == 'true' ]]; then mode+=(--profile-pipeline); fi
          "$RUNNER_TEMP/performance-venv/bin/python" tests/performance/benchmark.py \
            --original "$GITHUB_WORKSPACE/.performance/original" \
            --rust "$GITHUB_WORKSPACE/.performance/rust" \
            --frontend "$GITHUB_WORKSPACE/.performance/frontend" \
            --scratch "$RUNNER_TEMP/subscription-performance-private" \
            --publish "$RUNNER_TEMP/subscription-performance-public" \
            --frozen "$RUNNER_TEMP/performance-inputs/subscription-performance-inputs.bin" "${mode[@]}"
      - name: Preserve this pair including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-public/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Verify and combine all pairs
    needs: [prepare, compare]
    if: always() && inputs.inspect_run == '' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: subscription-performance-prepare-${{ github.run_id }}-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/performance-prepared
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: subscription-performance-shard-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/performance-workers
      - name: Reject incomplete, duplicated or unequal work
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/performance-venv"
          "$RUNNER_TEMP/performance-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
          mode=()
          if [[ '${{ inputs.diagnose_parse }}' == 'true' ]]; then mode=(--diagnostic parse); fi
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then mode=(--diagnostic health); fi
          "$RUNNER_TEMP/performance-venv/bin/python" tests/performance/parallel.py aggregate \
            --prepared "$RUNNER_TEMP/performance-prepared" --workers "$RUNNER_TEMP/performance-workers" \
            --publish "$RUNNER_TEMP/subscription-performance-public" "${mode[@]}"
      - name: Preserve complete sanitized comparison including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-public/
          if-no-files-found: warn
          retention-days: 30
