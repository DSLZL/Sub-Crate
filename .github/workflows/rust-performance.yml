name: Supplied subscription performance

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Inspect bounded sanitized diagnostics from an existing run without rebuilding
        type: string
        default: ''
      diagnose_parse:
        description: Only diagnose individual sources and three parse/pre-health requests
        type: boolean
        default: false
      diagnose_health:
        description: Profile the full-input health script and three warm requests without the long matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.inspect_run && 'subscription-report-inspection' || inputs.diagnose_health && 'subscription-health-diagnostic' || inputs.diagnose_parse && 'subscription-parse-diagnostic' || 'supplied-subscription-performance' }}
  cancel-in-progress: false

jobs:
  inspect:
    if: inputs.inspect_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Read existing sanitized field and work diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
        shell: bash
        run: |
          [[ "$INSPECT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "subscription-performance-$INSPECT_RUN-1" --dir "$RUNNER_TEMP/performance-inspect"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'performance-inspect/metrics.json').read_bytes())
          for row in report['samples']:
              if (row['block'] != 0 or row['concurrency'] != 1) and row.get('status') != 'failed':
                  continue
              keys = ('kind', 'case', 'status', 'failure', 'failure_observations', 'counts',
                      'warmup_counts', 'output_count', 'health_records', 'health_verified', 'work')
              selected = {key: row[key] for key in keys if key in row}
              selected['health_counts'] = row.get('health_counts', [])[:2]
              print(json.dumps(selected, sort_keys=True))
          PY
  compare:
    if: inputs.inspect_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9cc6b5fac966993364ae33da8797f446bbf7f571
          path: .performance/original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 52c844ef5518d2483a7122f26efd5385f56e8e58
          path: .performance/rust
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.diagnose_health
        with:
          ref: cda93a24dd2b51636fdc2151ba33f0ff2f206d62
          path: .performance/rust-baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .performance/frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed tooling and locked application dependencies
        run: |
          npm install --global pnpm@11.0.9 agent-browser@0.27.3
          pnpm --dir .performance/original/backend install --frozen-lockfile
          pnpm --dir .performance/frontend install --frozen-lockfile
          python3.12 -m venv "$RUNNER_TEMP/performance-venv"
          "$RUNNER_TEMP/performance-venv/bin/pip" install --require-hashes --only-binary=:all: -r tests/performance/requirements.txt
      - name: Check benchmark invariants and source
        run: |
          "$RUNNER_TEMP/performance-venv/bin/python" -m py_compile tests/performance/benchmark.py tests/performance/test_benchmark.py
          "$RUNNER_TEMP/performance-venv/bin/python" -m unittest discover -s tests/performance -p test_benchmark.py
      - name: Restore fixed Rust build cache (no runtime data)
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .performance/rust/rust/target
          key: subscription-performance-linux-x64-rust-1.98.0-52c844ef5518d2483a7122f26efd5385f56e8e58
          restore-keys: subscription-performance-linux-x64-rust-1.98.0-
      - name: Build exact original, Rust and unchanged frontend
        run: |
          (cd .performance/original/backend && node bundle-esbuild.js)
          pnpm --dir .performance/frontend build
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust
          git -C .performance/original diff --exit-code
          git -C .performance/rust diff --exit-code
          git -C .performance/frontend diff --exit-code
      - name: Compare node conversion components before and after the optimization
        if: inputs.diagnose_health
        run: |
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust script_transport::tests
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust script_transport::tests::profile_verifier_initialization -- --ignored --exact --nocapture
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust script_conversion::tests::profile_node_production -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/conversion-profile-candidate-first.log"
          # Cargo fingerprints can reuse same-named crates across checkout roots.
          # Keep the frozen baseline's test executable separate from the candidate.
          cargo +1.98.0 test --manifest-path .performance/rust-baseline/rust/Cargo.toml --target-dir "$RUNNER_TEMP/conversion-baseline-target" --locked --release --bin sub-store-rust script_conversion::tests::profile_node_production -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/conversion-profile-baseline.log"
          cargo +1.98.0 test --manifest-path .performance/rust/rust/Cargo.toml --locked --release --bin sub-store-rust script_conversion::tests::profile_node_production -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/conversion-profile-candidate-repeat.log"
          git -C .performance/rust-baseline diff --exit-code
      - name: Save public build inputs before private measurements
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .performance/rust/rust/target
          key: subscription-performance-linux-x64-rust-1.98.0-52c844ef5518d2483a7122f26efd5385f56e8e58
      - name: Load installed browser workflow and install headless Chromium
        run: |
          agent-browser skills get core
          agent-browser install --with-deps
      - name: Import original file and compare full workloads
        env:
          BENCHMARK_SUBSCRIPTION_B64: ${{ secrets.BENCHMARK_SUBSCRIPTION_B64 }}
        run: |
          umask 077
          diagnostic_args=()
          if [[ '${{ inputs.diagnose_parse }}' == 'true' ]]; then
            diagnostic_args=(--diagnose-parse)
          fi
          if [[ '${{ inputs.diagnose_health }}' == 'true' ]]; then
            diagnostic_args+=(--diagnose-health)
          fi
          "$RUNNER_TEMP/performance-venv/bin/python" tests/performance/benchmark.py \
            --original "$GITHUB_WORKSPACE/.performance/original" \
            --rust "$GITHUB_WORKSPACE/.performance/rust" \
            --frontend "$GITHUB_WORKSPACE/.performance/frontend" \
            --scratch "$RUNNER_TEMP/subscription-performance-private" \
            --publish "$RUNNER_TEMP/subscription-performance-public" "${diagnostic_args[@]}"
      - name: Show sanitized report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/subscription-performance-public/summary.md"; then
            cat "$RUNNER_TEMP/subscription-performance-public/summary.md"
          fi
      - name: Preserve sanitized metrics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subscription-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-performance-public/
          if-no-files-found: warn
          retention-days: 30
