name: Rust service and compatibility

on:
  workflow_dispatch:
  push:
    branches: [codex/rust-server-parity]
    paths: [backend/**, scripts/ip-flag-node.js, rust/**, tests/compat/**, .github/workflows/rust-compat-native.yml]

permissions:
  contents: read

jobs:
  native-baseline:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            unit-mode: unit
            rustflags: ''
            cargo_args: ''
            binary: rust/target/release/sub-store-rust
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            unit-mode: unit
            rustflags: ''
            cargo_args: ''
            binary: rust/target/release/sub-store-rust
          - target: windows-x64
            runner: windows-2025
            unit-mode: unit-windows
            rustflags: '-C target-feature=+crt-static'
            cargo_args: '--target x86_64-pc-windows-msvc'
            binary: rust/target/x86_64-pc-windows-msvc/release/sub-store-rust.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved reference fixes
        run: |
          git diff --no-ext-diff --binary --no-color --full-index --unified=0 9cc6b5fac966993364ae33da8797f446bbf7f571 -- backend scripts/ip-flag-node.js > "$RUNNER_TEMP/reference-fixes.patch"
          diff --strip-trailing-cr -u tests/compat/approved-reference-fixes.patch "$RUNNER_TEMP/reference-fixes.patch"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install locked development dependencies
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir tests/compat install --frozen-lockfile
          node tests/compat/build-native-utilities.cjs
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Runner self-checks
        run: python -m unittest discover -s tests/compat -p test_runner.py
      - name: Rust service formatting (preserve CI formatting output)
        run: |
          mkdir -p tests/compat/evidence/service-format
          cargo fmt --manifest-path rust/Cargo.toml --all
          cp -R rust/src tests/compat/evidence/service-format/src
          git diff --exit-code -- rust
      - name: Rust service lint, tests and release binary
        id: service-build
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          mkdir -p tests/compat/evidence/service-build
          cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets ${{ matrix.cargo_args }} -- -D warnings 2>&1 | tee tests/compat/evidence/service-build/clippy.log
          cargo test --manifest-path rust/Cargo.toml --locked --all-targets ${{ matrix.cargo_args }} 2>&1 | tee tests/compat/evidence/service-build/tests.log
          cargo build --manifest-path rust/Cargo.toml --locked --release --bin sub-store-rust ${{ matrix.cargo_args }} 2>&1 | tee tests/compat/evidence/service-build/release.log
      - name: Attribute structured parsing CPU in release mode
        if: ${{ !cancelled() && steps.service-build.outcome == 'success' && matrix.target == 'linux-x64' }}
        run: cargo test --manifest-path rust/Cargo.toml --locked --release --bin sub-store-rust clash::tests::profile_structured_subscription -- --ignored --exact --nocapture 2>&1 | tee tests/compat/evidence/service-build/parse-profile.log
      - name: Package and verify the native delivery
        id: service-package
        if: ${{ !cancelled() && steps.service-build.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          python tests/compat/distribution.py --target "${{ matrix.target }}" \
            --binary "${{ matrix.binary }}" \
            --output "$RUNNER_TEMP/sub-store-native-distribution"
      - name: Actual delivered Rust binary HTTP, state, restart and rollback contracts
        if: ${{ !cancelled() && steps.service-package.outcome == 'success' }}
        run: python tests/compat/service.py --node "$(node -p 'process.execPath')" --binary "${{ steps.service-package.outputs.binary }}"
      - name: Preserve runnable native archive, notices and provenance
        if: ${{ !cancelled() && steps.service-package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-distribution-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.service-package.outputs.publish }}
          if-no-files-found: error
          retention-days: 30
      - name: Build general JS helpers
        if: ${{ !cancelled() }}
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode helpers
      - name: Native Rust JS probe
        if: ${{ !cancelled() }}
        run: python tests/compat/probe.py --node "$(node -p 'process.execPath')"
      - name: Node HTTP contract slice
        if: ${{ !cancelled() }}
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode contracts
      - name: Node unit suite including reference regressions
        if: ${{ !cancelled() }}
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode ${{ matrix.unit-mode }}
      - name: Preserve platform evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/compat/evidence/
          if-no-files-found: error
          retention-days: 30

  frontend-baseline:
    name: Unchanged frontend (headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .compat-frontend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install locked frontend and backend dependencies
        run: |
          mkdir -p tests/compat/evidence/frontend-setup
          npm install --global pnpm@11.0.9 agent-browser@0.27.3 2>&1 | tee tests/compat/evidence/frontend-setup/tools.log
          pnpm --dir backend install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/backend-install.log
          pnpm --dir tests/compat install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/compat-install.log
          pnpm --dir .compat-frontend install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/frontend-install.log
          node tests/compat/build-native-utilities.cjs
      - name: Build the unchanged frontend with type checks
        run: pnpm --dir .compat-frontend build 2>&1 | tee tests/compat/evidence/frontend-setup/frontend-build.log
      - name: Regenerate frozen source and frontend compatibility inventory
        run: node tests/compat/inventory.cjs "$GITHUB_WORKSPACE/.compat-frontend" "$GITHUB_WORKSPACE/tests/compat/evidence/frontend-setup/source-inventory.json"
      - name: Package and extract the unchanged frontend delivery
        id: frontend-package
        run: python tests/compat/distribution.py --frontend "$GITHUB_WORKSPACE/.compat-frontend" --output "$GITHUB_WORKSPACE/.compat-delivery/frontend"
      - name: Install headless Chrome and Linux dependencies
        run: agent-browser install --with-deps 2>&1 | tee tests/compat/evidence/frontend-setup/browser-install.log
      - name: Browser UI, persisted state and HAR contracts
        run: |
          python tests/compat/frontend.py --node "$(node -p 'process.execPath')" \
            --frontend "$GITHUB_WORKSPACE/.compat-frontend" \
            --assets "${{ steps.frontend-package.outputs.assets }}" \
            --browser "$(npm root --global)/agent-browser/bin/agent-browser-linux-x64"
      - name: Build the Rust service on the GitHub runner
        id: frontend-rust-build
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --manifest-path rust/Cargo.toml --locked --release --bin sub-store-rust 2>&1 | tee tests/compat/evidence/frontend-setup/rust-build.log
      - name: Package and extract the Rust backend used by the frontend
        id: frontend-backend-package
        if: ${{ !cancelled() && steps.frontend-rust-build.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: python tests/compat/distribution.py --target linux-x64 --binary "$GITHUB_WORKSPACE/rust/target/release/sub-store-rust" --output "$GITHUB_WORKSPACE/.compat-delivery/frontend-backend"
      - name: Unchanged frontend CRUD, settings and backup restore against Rust
        if: ${{ !cancelled() && steps.frontend-package.outcome == 'success' && steps.frontend-backend-package.outcome == 'success' }}
        run: |
          python tests/compat/frontend.py --node "$(node -p 'process.execPath')" \
            --frontend "$GITHUB_WORKSPACE/.compat-frontend" \
            --assets "${{ steps.frontend-package.outputs.assets }}" \
            --browser "$(npm root --global)/agent-browser/bin/agent-browser-linux-x64" \
            --rust-binary "${{ steps.frontend-backend-package.outputs.binary }}"
      - name: Unchanged frontend through the standalone Rust port
        if: ${{ !cancelled() && steps.frontend-package.outcome == 'success' && steps.frontend-backend-package.outcome == 'success' }}
        run: |
          python tests/compat/frontend.py --node "$(node -p 'process.execPath')" \
            --frontend "$GITHUB_WORKSPACE/.compat-frontend" \
            --assets "${{ steps.frontend-package.outputs.assets }}" \
            --browser "$(npm root --global)/agent-browser/bin/agent-browser-linux-x64" \
            --rust-binary "${{ steps.frontend-backend-package.outputs.binary }}" --standalone
      - name: Deliver the exact frontend assets used by all three browser runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.frontend-package.outputs.publish }}/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-frontend-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/compat/evidence/
          if-no-files-found: error
          retention-days: 30

  docker-baseline:
    name: Docker ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install locked oracle dependencies
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir tests/compat install --frozen-lockfile
          node tests/compat/build-native-utilities.cjs
      - name: Runner self-checks
        run: python -m unittest discover -s tests/compat -p test_runner.py
      - name: Build general JS helpers
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode helpers
      - name: Container release binary, HTTP, persistence and restart contracts
        run: python tests/compat/probe.py --node "$(node -p 'process.execPath')" --docker
      - name: Actual Node-free Rust service container contracts
        id: docker-service
        if: ${{ !cancelled() }}
        run: python tests/compat/service.py --node "$(node -p 'process.execPath')" --docker
      - name: Deliver the saved and reloaded production image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-distribution-docker-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.docker-service.outputs.publish }}/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve container evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-docker-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/compat/evidence/
          if-no-files-found: error
          retention-days: 30
