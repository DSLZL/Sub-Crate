name: Rust compatibility native baseline

on:
  workflow_dispatch:
  push:
    branches: [codex/rust-server-parity]
    paths: [rust/**, tests/compat/**, .github/workflows/rust-compat-native.yml]

permissions:
  contents: read

jobs:
  native-baseline:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            unit-mode: unit
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            unit-mode: unit
          - target: windows-x64
            runner: windows-2025
            unit-mode: unit-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen oracle source
        run: git diff --exit-code 9cc6b5fac966993364ae33da8797f446bbf7f571 -- backend scripts/ip-flag-node.js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install locked development dependencies
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Runner self-checks
        run: python -m unittest discover -s tests/compat -p test_runner.py
      - name: Build general JS helpers
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode helpers
      - name: Native Rust JS probe
        if: ${{ !cancelled() }}
        run: python tests/compat/probe.py
      - name: Node HTTP contract slice
        if: ${{ !cancelled() }}
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode contracts
      - name: Frozen Node unit baseline
        if: ${{ !cancelled() }}
        run: python tests/compat/reference.py --node "$(node -p 'process.execPath')" --mode ${{ matrix.unit-mode }}
      - name: Preserve platform evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/compat/evidence/
          if-no-files-found: error
          retention-days: 30
