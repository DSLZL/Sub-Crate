name: Rust service and compatibility

on:
  workflow_dispatch:
    inputs:
      harness_only:
        description: Run the Rust harness migration self-checks
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [rust/**, tests/**, .config/nextest.toml, .github/actions/node-reference/**, .github/workflows/rust-compat-native.yml, .github/workflows/rust-tests.yml]

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/rust-tests.yml

  frontend-baseline:
    name: Unchanged frontend (nextest and headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      TEST_FRONTEND: ${{ github.workspace }}/.compat-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep compiler output on the runner
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sub-store-frontend-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: 4bd7b0acbe65466b933ccea14fc61dbebe036ead
          path: .compat-frontend
          persist-credentials: false
      - uses: ./.github/actions/node-reference
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest@0.9.149
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/sub-store-frontend-build
          key: nextest-frontend-temp-1.98.0-${{ hashFiles('tests/Cargo.toml', 'tests/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: nextest-frontend-temp-1.98.0-
      - name: Install locked frontend and reference dependencies
        run: |
          mkdir -p tests/compat/evidence/frontend-setup
          npm install --global pnpm@11.0.9 agent-browser@0.27.3 2>&1 | tee tests/compat/evidence/frontend-setup/tools.log
          pnpm --dir backend install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/backend-install.log
          pnpm --dir tests/compat install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/compat-install.log
          pnpm --dir .compat-frontend install --frozen-lockfile 2>&1 | tee tests/compat/evidence/frontend-setup/frontend-install.log
          node tests/compat/build-native-utilities.cjs
          (cd backend && node bundle-esbuild.js)
      - name: Build unchanged frontend and source inventory
        run: |
          pnpm --dir .compat-frontend build 2>&1 | tee tests/compat/evidence/frontend-setup/frontend-build.log
          node tests/compat/inventory.cjs "$GITHUB_WORKSPACE/.compat-frontend" "$GITHUB_WORKSPACE/tests/compat/evidence/frontend-setup/source-inventory.json"
          agent-browser install --with-deps 2>&1 | tee tests/compat/evidence/frontend-setup/browser-install.log
      - name: Build delivered Rust backend on runner
        run: |
          cargo +1.98.0 fmt --manifest-path tests/Cargo.toml --all -- --check
          cargo +1.98.0 build --manifest-path rust/Cargo.toml --locked --release --bin sub-store-rust
          echo "TEST_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
          echo "TEST_BROWSER=$(npm root --global)/agent-browser/bin/agent-browser-linux-x64" >> "$GITHUB_ENV"
      - name: Package and extract unchanged frontend
        id: frontend-package
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test frontend --config-file .config/nextest.toml --profile frontend-delivery -E 'test(=frontend_delivery)'
      - name: Package and extract Rust backend
        id: frontend-backend-package
        env:
          TEST_RUST_BINARY: ${{ env.CARGO_TARGET_DIR }}/release/sub-store-rust
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test native --config-file .config/nextest.toml --profile delivery -E 'test(=native_delivery)'
      - name: Run all 21 browser flows in each of three hosting modes
        env:
          TEST_RUST_BINARY: ${{ steps.frontend-backend-package.outputs.binary }}
          TEST_FRONTEND_ASSETS: ${{ steps.frontend-package.outputs.assets }}
        run: |
          cargo +1.98.0 nextest list --manifest-path tests/Cargo.toml --locked --test frontend --config-file .config/nextest.toml -E 'test(frontend::)'
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test frontend --config-file .config/nextest.toml --profile frontend -E 'test(frontend::)'
      - name: Deliver exact assets used by all browser runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.frontend-package.outputs.publish }}/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve browser evidence and JUnit, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-frontend-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/compat/evidence/frontend-setup
            ${{ env.CARGO_TARGET_DIR }}/nextest/
            ${{ runner.temp }}/sub-store-frontend-*
            ${{ runner.temp }}/sub-store-native-delivery-*
          if-no-files-found: warn
          retention-days: 30
  docker:
    if: ${{ !inputs.harness_only }}
    name: Docker ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      TEST_DOCKER_IMAGE: sub-store-nextest:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      TEST_DOCKER_PROBE_IMAGE: sub-store-nextest-probe:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep compiler output on the runner
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sub-store-docker-tests" >> "$GITHUB_ENV"
      - uses: ./.github/actions/node-reference
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest@0.9.149
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/sub-store-docker-tests
          key: nextest-docker-${{ matrix.target }}-1.98.0-${{ hashFiles('tests/Cargo.toml', 'tests/Cargo.lock') }}
          restore-keys: nextest-docker-${{ matrix.target }}-1.98.0-
      - name: Prepare frozen reference and script probe inputs
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir tests/compat install --frozen-lockfile
          node tests/compat/build-native-utilities.cjs
          node tests/compat/build-helpers.cjs
          (cd backend && node bundle-esbuild.js)
          echo "TEST_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Rust harness checks
        run: |
          cargo +1.98.0 fmt --manifest-path tests/Cargo.toml --all -- --check
          cargo +1.98.0 clippy --manifest-path tests/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --lib --config-file .config/nextest.toml --profile ci
      - name: Build actual Node-free images on the native runner
        run: |
          docker build --file tests/compat/Probe.Dockerfile --tag "$TEST_DOCKER_PROBE_IMAGE" .
          docker build --file rust/Dockerfile --tag "$TEST_DOCKER_IMAGE" .
      - name: Package save extract and reload production image
        id: docker-package
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test docker --config-file .config/nextest.toml --profile delivery -E 'test(=docker::delivery)'
      - name: Verify native probe image and owned watchdog cleanup
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test docker --config-file .config/nextest.toml --profile docker-images -E 'not test(=docker::delivery)'
      - name: Actual delivered containers scripts wire state restarts and rollback
        run: cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test native --config-file .config/nextest.toml --profile acceptance -E 'not (test(=native_delivery) or test(=corrupt_native_startups_and_restore_journals_exit_without_resetting_either_file) or test(=frozen_node_unit_suite) or test(=frozen_node_http_suites))'
      - name: Clean only containers owned by this runner job
        if: always()
        run: |
          docker ps -aq --filter "ancestor=$TEST_DOCKER_IMAGE" --filter 'name=nextest-' | xargs --no-run-if-empty docker rm --force
          docker ps -aq --filter "ancestor=$TEST_DOCKER_PROBE_IMAGE" --filter 'name=nextest-probe-' | xargs --no-run-if-empty docker rm --force
      - name: Deliver saved and reloaded production image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-distribution-docker-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.docker-package.outputs.publish }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve container reports including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-docker-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sub-store-docker-tests/nextest/
            ${{ runner.temp }}/sub-store-docker-delivery-*
            ${{ runner.temp }}/sub-store-docker-probe-image-*
            ${{ runner.temp }}/sub-store-docker-cleanup-*
            ${{ runner.temp }}/sub-store-state-parity-*
            ${{ runner.temp }}/sub-store-script-probe-*
            ${{ runner.temp }}/sub-store-age-probe-*
            ${{ runner.temp }}/sub-store-download-probe-*
            ${{ runner.temp }}/sub-store-service-*
          if-no-files-found: warn
          retention-days: 30
