name: Rust test harness migration

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [test/nextest-migration]
    paths: [tests/Cargo.toml, tests/Cargo.lock, tests/src/**, .config/nextest.toml, .github/workflows/rust-tests.yml]

permissions:
  contents: read

jobs:
  self-checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Keep compiler output on the runner
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sub-store-test-build" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest@0.9.149
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/sub-store-test-build
          key: nextest-harness-${{ matrix.runner }}-1.98.0-${{ hashFiles('tests/Cargo.toml', 'tests/Cargo.lock') }}
      - name: Preserve runner formatting patch during migration
        run: |
          cargo +1.98.0 fmt --manifest-path tests/Cargo.toml --all
          cargo +1.98.0 fmt --manifest-path rust/Cargo.toml --all
          git diff --binary -- tests/src tests/native.rs rust/examples/collect_notices.rs > "$RUNNER_TEMP/harness-format.patch"
      - name: Clippy
        run: cargo +1.98.0 clippy --manifest-path tests/Cargo.toml --locked --all-targets -- -D warnings
      - name: Inventory and nextest self-checks
        if: ${{ !cancelled() }}
        run: |
          cargo +1.98.0 nextest list --manifest-path tests/Cargo.toml --locked --lib --config-file .config/nextest.toml
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --lib --config-file .config/nextest.toml --profile ci
      - uses: ./.github/actions/node-reference
      - name: Prepare fixed reference and embedded utilities
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir tests/compat install --frozen-lockfile
          node tests/compat/build-native-utilities.cjs
          node tests/compat/build-helpers.cjs
      - name: Bundle frozen reference
        working-directory: backend
        run: node bundle-esbuild.js
      - name: Build Rust service on runner
        run: cargo +1.98.0 build --manifest-path rust/Cargo.toml --locked --release --bin sub-store-rust
      - name: Execute migrated native contracts
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "TEST_RUST_BINARY=$CARGO_TARGET_DIR/release/sub-store-rust$suffix" >> "$GITHUB_ENV"
          export TEST_RUST_BINARY="$CARGO_TARGET_DIR/release/sub-store-rust$suffix"
          export TEST_NODE="$(node -p 'process.execPath')"
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test native --config-file .config/nextest.toml --profile acceptance
      - name: Preserve test reports and small source patches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-harness-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-format.patch
            ${{ runner.temp }}/sub-store-test-build/nextest/ci/junit.xml
            ${{ runner.temp }}/sub-store-test-build/nextest/acceptance/junit-acceptance.xml
            ${{ runner.temp }}/sub-store-reference-*
            ${{ runner.temp }}/sub-store-state-parity-*
          if-no-files-found: warn
          retention-days: 7
