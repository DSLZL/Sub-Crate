name: Rust test harness migration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Format and workflow syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check source formatting
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --no-self-update
          cargo +1.98.0 fmt --all -- --check
      - name: Check delivery workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml .github/workflows/rust-compat-native.yml .github/workflows/rust-tests.yml

  build:
    name: Build and unit test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: windows-x64
            runner: windows-2025-vs2026
          - target: windows-arm64
            runner: windows-11-vs2026-arm
          - target: macos-x64
            runner: macos-26-intel
          - target: macos-arm64
            runner: macos-26
    env:
      RUSTFLAGS: ${{ startsWith(matrix.target, 'windows-') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
      - name: Clippy
        run: |
          cargo +1.98.0 clippy --manifest-path tests/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.98.0 clippy --manifest-path crates/sub-crate/Cargo.toml --locked --all-targets -- -D warnings
      - name: Inventory and nextest self-checks
        if: ${{ !cancelled() }}
        run: |
          cargo +1.98.0 nextest list --manifest-path tests/Cargo.toml --locked --lib --config-file .config/nextest.toml
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --lib --config-file .config/nextest.toml --profile ci
      - name: Production Rust unit tests
        if: ${{ !cancelled() }}
        run: |
          cargo +1.98.0 nextest list --manifest-path crates/sub-crate/Cargo.toml --locked --all-targets --config-file .config/nextest.toml
          cargo +1.98.0 nextest run --manifest-path crates/sub-crate/Cargo.toml --locked --all-targets --config-file .config/nextest.toml --profile production
      - name: Build release binary
        run: cargo +1.98.0 build --manifest-path crates/sub-crate/Cargo.toml --locked --release --bin sub-crate
      - name: Preserve release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sub-crate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/sub-crate${{ startsWith(matrix.target, 'windows-') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-unit-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Acceptance ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: windows-x64
            runner: windows-2025-vs2026
    env:
      RUSTFLAGS: ${{ startsWith(matrix.target, 'windows-') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: ./.github/actions/rust-setup
      - uses: ./.github/actions/node-reference
      - name: Prepare fixed reference and embedded utilities
        run: |
          npm install --global pnpm@11.0.9
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir tests/compat install --frozen-lockfile
          node tests/compat/build-native-utilities.cjs
          node tests/compat/build-helpers.cjs
      - name: Bundle frozen reference
        working-directory: backend
        run: node bundle-esbuild.js
      - name: Build Rust service on runner
        run: cargo +1.98.0 build --manifest-path crates/sub-crate/Cargo.toml --locked --release --bin sub-crate --example script_probe --example collect_notices
      - name: Attribute release parsing and conversion CPU
        if: matrix.target == 'linux-x64'
        run: |
          cargo +1.98.0 nextest run --manifest-path crates/sub-crate/Cargo.toml --locked --release --bin sub-crate --config-file .config/nextest.toml --profile cpu-parse --run-ignored only -E 'test(=clash::tests::profile_structured_subscription)' --success-output immediate
          cargo +1.98.0 nextest run --manifest-path crates/sub-crate/Cargo.toml --locked --release --bin sub-crate --config-file .config/nextest.toml --profile cpu-conversion --run-ignored only -E 'test(=script::conversion::tests::profile_node_production)' --success-output immediate
      - name: Execute migrated native contracts
        id: native
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "TEST_RUST_BINARY=$CARGO_TARGET_DIR/release/sub-crate$suffix" >> "$GITHUB_ENV"
          export TEST_RUST_BINARY="$CARGO_TARGET_DIR/release/sub-crate$suffix"
          export TEST_PROBE_BINARY="$CARGO_TARGET_DIR/release/examples/script_probe$suffix"
          TEST_NODE=$(node -p 'process.execPath')
          export TEST_NODE
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test native --config-file .config/nextest.toml --profile delivery -E 'test(=native_delivery)'
      - name: Run actual contracts against extracted delivery
        env:
          TEST_RUST_BINARY: ${{ steps.native.outputs.binary }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export TEST_PROBE_BINARY="$CARGO_TARGET_DIR/release/examples/script_probe$suffix"
          TEST_NODE=$(node -p 'process.execPath')
          export TEST_NODE
          cargo +1.98.0 nextest run --manifest-path tests/Cargo.toml --locked --test native --config-file .config/nextest.toml --profile acceptance -E 'not test(=native_delivery)'
      - name: Preserve verified native delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-distribution-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.publish }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-harness-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/
            ${{ runner.temp }}/sub-store-native-delivery-*
            ${{ runner.temp }}/sub-store-reference-*
            ${{ runner.temp }}/sub-store-state-parity-*
            ${{ runner.temp }}/sub-store-script-probe-*
            ${{ runner.temp }}/sub-store-age-probe-*
            ${{ runner.temp }}/sub-store-download-probe-*
            ${{ runner.temp }}/sub-store-service-*
          if-no-files-found: warn
          retention-days: 7
