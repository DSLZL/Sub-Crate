name: Windows age timeout diagnosis

on:
  workflow_dispatch:
  push:
    branches: [codex/rust-server-parity]
    paths: [.github/workflows/rust-age-diagnostic.yml, .github/diagnostics/windows-age.py]

permissions:
  contents: read
  actions: read

jobs:
  historical-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Retrieve the actual historical Windows delivery on the runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39358087026 --repo DSLZL/Sub-Store --name m5-distribution-windows-x64-39358087026-1 --dir "$RUNNER_TEMP/age-historical"
      - name: Observe the unchanged five-second HTTP boundary
        run: python .github/diagnostics/windows-age.py
      - name: Preserve diagnostic observations separately from acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-age-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/age-timeout-evidence/
          if-no-files-found: error
          retention-days: 30
